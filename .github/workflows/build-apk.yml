
name: Build Amar Khamar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Amar_Khamar_New_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o Amar_Khamar_New_Project.zip -d extracted
          cp -a extracted/Amar_Khamar_New_Project/. .

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-khamar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
